<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Ollama Cookie Sync</title>
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; width: 260px; padding: 12px; font-size: 13px; }
    h1 { font-size: 14px; margin: 0 0 8px; }
    .status { padding: 8px; border-radius: 6px; margin: 8px 0; }
    .ok { background: #e6f4ea; color: #137333; }
    .warn { background: #fef7e0; color: #7a5c00; }
    .off { background: #f1f3f4; color: #5f6368; }
    button { margin-top: 8px; padding: 6px 12px; border: 0; border-radius: 6px; background: #1a73e8; color: #fff; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: default; }
    a { color: #1a73e8; }
  </style>
</head>
<body>
  <h1>Ollama Cookie Sync</h1>
  <div id="status" class="off">Checking…</div>
  <button id="sync">Sync now</button>
  <p style="margin-top:10px;color:#5f6368;">
    <a href="options.html" target="_blank">Settings</a> ·
    <a href="https://github.com/Kosello/ollama-cookie-sync-extension" target="_blank">About</a>
  </p>
  <script src="popup.js"></script>
</body>
</html>
